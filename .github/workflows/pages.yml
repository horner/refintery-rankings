name: Publish interactive rankings

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rebuild and verify research and interactive screen
        run: |
          python3 scripts/build.py
          python3 ftc/scripts/build.py
          python3 broadcast/scripts/build.py
          python3 scripts/verify.py
          python3 ftc/scripts/verify.py
          python3 broadcast/scripts/verify.py
          node --check broadcast/dist/app.js
          node --check broadcast/dist/top10.js
          git diff --exit-code
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload interactive site
        uses: actions/upload-pages-artifact@v4
        with:
          path: broadcast/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
